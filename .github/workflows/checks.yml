name: Papyrus checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front/package-lock.json
      - run: npm ci
        working-directory: Front
      - run: npm run editor-host:build
        working-directory: Front
      - run: node --test Tests/editor-host.test.mjs Tests/http-core.test.mjs Tests/locales.test.mjs Tests/library-api.test.mjs Tests/use-studio-workspace.test.mjs Tests/pdf-preview.test.mjs Tests/workspace-ui.test.mjs Tests/automation-ui.test.mjs Tests/studio-state.test.mjs
      - run: npm run build
        working-directory: Front
      - run: dotnet build Back/Papyrus.Api.csproj
      - run: dotnet test Tests/Papyrus.Api.Tests/Papyrus.Api.Tests.csproj -p:SkipRustBuild=true
      - run: python3 Tests/papyrus_cli_protocol_smoke.py
      - run: python3 Tests/converter_hostile_smoke.py
      - run: python3 Tests/backup_test.py
  rust-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --workspace --locked
        working-directory: Application
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Back/Papyrus.Api.csproj
      - run: dotnet list Back/Papyrus.Api.csproj package --vulnerable --include-transitive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: Application