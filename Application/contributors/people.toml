# Contributor names for the About window.
#
# Copy this block, replacing your-github-username (every field is optional):
#
#   [people.your-github-username]
#   real_name = "Your Name"        # shown when the viewer picks "Real name"
#   display_name = "Nickname"      # shown when the viewer picks "Display name"
#   sync_github_name = true        # or: use the name on your public GitHub profile as display name
#
# A name is shown only for a login that contributors.json marks with `people_entry`.

[people.alireza-dayyani]
real_name = "Alireza Dayyani"
display_name = "Alireza Dayyani"
sync_github_name = false
